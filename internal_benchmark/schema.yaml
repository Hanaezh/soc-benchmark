Access Behavior Audit:
  description: "访问行为审计日志字段结构。"
  fields:
    - name: description
      description: "访问事件详细描述，包含协议类型、源/目的IP端口等信息。"
      type: "string"
      example: "HTTP请求访问. 来源：172.26.255.48/2175, 目的：172.26.130.95/9100"

    - name: dmac
      description: "目标MAC地址。"
      type: "string (MAC)"
      example: "28-FB-AE-66-EB-01"

    - name: dport
      description: "目标端口，53(DNS)占比74.9%，80(HTTP)/443(HTTPS)次之。"
      type: "integer"
      example: 53

    - name: dst
      description: "目标IP地址，主要指向内网地址。"
      type: "string (ip)"
      example: "192.172.2.46"

    - name: protocol
      description: "网络协议类型。"
      type: "string"
      example: "dns, mysql, ftp 等"

    - name: request_header
      description: "HTTP请求头，含Telegraf、浏览器等客户端特征。"
      type: "string"
      example: "Authorization: Basic telegraf:G%8qXi$2*@MWpl..."

    - name: request_length
      description: "请求内容长度，主要分布在292-312字节范围。"
      type: "integer"
      example: 292

    - name: request_method
      description: "HTTP请求方法，取值例如GET， CWD等。"
      type: "string"
      example: "GET"

    - name: response_length
      description: "响应内容长度，取值在0-1730之间。"
      type: "integer"
      example: 0

    - name: response_status
      description: "响应状态码，SERVFAIL占33.4%，200占9.3%，其它取值还有404、502等。"
      type: "string"
      example: "SERVFAIL"

    - name: smac
      description: "源MAC地址。"
      type: "string (MAC)"
      example: "94-90-10-DB-67-01"

    - name: sport
      description: "源端口，高数值临时端口(49664/49665)出现频率较高。"
      type: "integer"
      example: 49664

    - name: src
      description: "源IP地址。"
      type: "string (ip)"
      example: "192.172.2.46"

    - name: time
      description: "日志生成时间，精确到秒级。"
      type: "string (datetime)"
      example: "2025-01-13 16:26:09"

    - name: url
      description: "请求URL路径，/metrics(监控指标接口)占比3.8%。"
      type: "string"
      example: "/metrics"

    - name: vlan
      description: "虚拟局域网标识。"
      type: "integer"
      example: 1914