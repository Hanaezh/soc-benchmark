Honeypot Event Query:
  description: "踩蜜记录是攻击者触发蜜罢时被记录下的攻击行为数据。"
  fields:
    - name: time
      description: "踩蜜日志产生时间。"
      type: "string (datetime)"
      example: "2025-02-11 09:15:50"

    - name: src
      description: "源IP, 是攻击者IP。"
      type: "string (ip)"
      example: "39.185.215.74"

    - name: dst
      description: "目的IP，是受害者IP。"
      type: "string (ip)"
      example: "172.26.8.85"

    - name: sport
      description: "源端口。"
      type: "string (port)"
      example: "14847"

    - name: dport
      description: "目的端口。"
      type: "string (port)"
      example: "8091"

    - name: protocol
      description: "使用的网络协议，共计 4 种唯一值，包括 HTTP、TCP、http、ICMP。"
      type: "string (enum)"
      example: "TCP"

    - name: url
      description: "URL 地址，反映攻击者或用户请求的具体资源。"
      type: "string (nullable)"
      example: "/index.php"

    - name: behavior_type
      description: "踩蜜行为类型，共计 6 种唯一值，包括 普通访问行为、扫描、其他行为、疑似恶意操作、爬虫。"
      type: "string (enum)"
      example: "疑似恶意操作"

    - name: payload
      description: "攻击载荷。"
      type: "string"
      example: "X_Forwarded_For: 183.129.153.151"

    - name: behavior
      description: "记录踩蜜行为名称。"
      type: "string"
      example: "尝试web访问"

    - name: domain
      description: "域名，用于分析攻击者或用户访问的目标服务器。"
      type: "string (domain)"
      example: "dns.harbin2025.com"


Security Alert Analysis:
  description: "攻击日志（安全告警）字段结构。"
  fields:
    - name: cve
      description: "相关的CVE漏洞编号列表。"
      type: "string (array in JSON format)"
      example: ""

    - name: description
      description: "攻击事件的描述信息。"
      type: "string"
      example: "检测到系统命令注入攻击. 来源：180.141.39.130/38396, 目的：172.26.129.7/40001"

    - name: dmac
      description: "目标设备的MAC地址。"
      type: "string"
      example: "00-00-5E-00-01-10"

    - name: dport
      description: "目标端口。"
      type: "string"
      example: "40001"

    - name: dst
      description: "目标IP地址。"
      type: "string (ip)"
      example: "172.26.129.7"

    - name: event_time
      description: "攻击事件发生的时间。"
      type: "string (datetime)"
      example: "2025-01-11 09:01:15"

    - name: name
      description: "攻击名称，可能为空。"
      type: "string or null"
      example: "远程命令执行"

    - name: protocol
      description: "攻击使用的网络协议。"
      type: "string"
      example: "http"

    - name: smac
      description: "源设备的MAC地址。"
      type: "string"
      example: "28-FB-AE-66-EB-01"

    - name: sport
      description: "源端口。"
      type: "string"
      example: "38396"

    - name: src
      description: "来源IP地址，攻击者的IP。"
      type: "string (ip)"
      example: "180.141.39.130"

    - name: status
      description: "攻击事件的状态。try or success"
      type: "string"
      example: "try"

    - name: ua_agent
      description: "用户代理信息。"
      type: "string"
      example: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/104.0.0.0 Safari/537.36"

    - name: url
      description: "攻击目标的URL。"
      type: "string"
      example: "/manager/radius/server_ping.php"

    - name: vlan
      description: "攻击事件涉及的VLAN ID。"
      type: "string"
      example: "2110"


Threat Intelligence Matching:
